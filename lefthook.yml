# Git hooks (managed by lefthook). Installed by the flake's shellHook.
#
# pre-commit: scan for secrets (trufflehog) and run the test suite (bin/test).
# Both are wrapped in `nix develop path:. --command` because the hook fires outside the
# flake devshell, so trufflehog / bundler / scampi wouldn't otherwise be on PATH.
pre-commit:
  commands:
    secrets:
      run: nix develop path:. --command trufflehog git file://. --since-commit HEAD --only-verified --fail
    tests:
      run: nix develop path:. --command bin/test
